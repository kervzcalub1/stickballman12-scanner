name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    # Hermetic: ephemeral Postgres + throwaway test secrets. No production creds.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sbm_test
      # Test-only values (ephemeral CI DB has no real data). The auth fixture mints
      # tokens with this same SESSION_SECRET, so they verify against the server.
      SESSION_SECRET: ci-e2e-session-secret-0123456789
      ADMIN_PASSWORD: ci-e2e-admin-pass
      # Gift card codes are encrypted at rest, and the endpoint that stores one FAILS
      # CLOSED without a key — which is correct, and is exactly why CI needs one: without
      # it the buy-cart specs test a 503 instead of the controls they exist to guard.
      # Test-only, and deliberately not a secret: the CI database is ephemeral and holds
      # no real card. (Production sets its own; see docs/context/buy-cart.md.)
      BUY_GC_KEY: 0000111122223333444455556666777788889999aaaabbbbccccddddeeeeffff
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Migrate test DB (idempotent schema)
        run: npm run db:setup
      # Shelf locations are a SEPARATE, idempotent seed — `db:setup` only creates the
      # empty table. A real environment is provisioned db:setup THEN db:seed-manheim
      # (docs/context/deploy.md), so CI has to do the same or the put-away, Locate and
      # "Select all" specs run against a warehouse with no shelves and fail on data
      # that was never loaded rather than on a defect.
      - name: Seed shelf locations (idempotent)
        run: npm run db:seed-manheim
      - name: Run E2E
        run: npm run e2e
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
